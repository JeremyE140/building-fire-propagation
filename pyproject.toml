[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "building-fire-propagation"
version = "0.1.0"
description = "Simulation probabiliste de propagation d'incendie dans un bâtiment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "Pillow",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["config", "main"]
packages = ["modules"]
